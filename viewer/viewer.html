<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find in Images — PDF Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #404040;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    #toolbar {
      width: 100%;
      background: #2a2a2a;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    #toolbar span { font-size: 14px; opacity: 0.8; }

    #status {
      margin-left: auto;
      font-size: 13px;
      color: #aaa;
    }

    #viewer-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-bottom: 40px;
      width: 100%;
    }

    .page-wrapper {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .page-wrapper canvas {
      display: block;
    }

    /* Text layer sits on top of canvas, invisible but selectable */
    .text-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      user-select: text;
    }

    .text-layer span {
      position: absolute;
      color: transparent;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span>Find in Images — PDF Viewer</span>
    <span id="status">Loading...</span>
  </div>

  <div id="viewer-container"></div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
