<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find in Images — PDF Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #404040;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    #toolbar {
      width: 100%;
      background: #2a2a2a;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    #toolbar span { font-size: 14px; opacity: 0.8; }

    #status {
      margin-left: auto;
      font-size: 13px;
      color: #aaa;
    }

    #lang-label { font-size: 12px; opacity: 0.7; }

    #lang-select {
      background: #3a3a3a;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    #reprocess {
      background: #3a3a3a;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    #reprocess:hover { background: #4a4a4a; }

    #viewer-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-bottom: 40px;
      width: 100%;
      max-width: 1200px;
      padding-left: 20px;
      padding-right: 20px;
    }

    .page-wrapper {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .page-wrapper canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Text layer: invisible spans for Ctrl+F AND text selection/copy. Must NOT
       use overflow:hidden — Chrome's Find skips text clipped outside the viewport. */
    .text-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .text-layer span {
      position: absolute;
      color: transparent;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      /* Selectable + copyable, and visible to Chrome's Find */
      user-select: text;
      -webkit-user-select: text;
    }

    /* Search-only OCR correction variants: findable by Ctrl+F but excluded from
       mouse selection/copy so copied text isn't duplicated (e.g. "he11o hello"). */
    .text-layer span.variant {
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }

    /* Make the selection highlight visible over the canvas */
    .text-layer span::selection {
      background: rgba(0, 120, 255, 0.35);
    }

    /* ── Custom find bar ───────────────────────────────────────────────── */
    #find-bar {
      position: fixed;
      top: 56px;
      right: 24px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 6px 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    #find-bar[hidden] { display: none; }

    #find-input {
      background: #1e1e1e;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
      width: 200px;
      outline: none;
    }

    #find-count {
      color: #aaa;
      font-size: 12px;
      min-width: 46px;
      text-align: center;
    }

    #find-bar button {
      background: #3a3a3a;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 9px;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }
    #find-bar button:hover { background: #4a4a4a; }
    #find-bar button:disabled { opacity: 0.4; cursor: default; }

    /* Highlight boxes: translucent fill (text stays readable) + a contrasting
       outline so they're visible even on colorful page backgrounds. */
    .find-highlight {
      position: absolute;
      background: rgba(255, 235, 59, 0.45);
      outline: 1.5px solid rgba(30, 30, 30, 0.85);
      border-radius: 2px;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 5;
    }
    /* Active match: bold red ring framed in white — pops on any background — plus
       a brief pulse so it's obvious where navigation jumped to. */
    .find-highlight.active {
      background: rgba(255, 90, 0, 0.55);
      outline: 2px solid #ffffff;
      box-shadow: 0 0 0 3px #ff1744, 0 0 10px 2px rgba(255, 23, 68, 0.7);
      z-index: 6;
      animation: fii-pulse 0.9s ease-out 2;
    }
    @keyframes fii-pulse {
      0%, 100% { box-shadow: 0 0 0 3px #ff1744, 0 0 0 0 rgba(255, 23, 68, 0.0); }
      50%      { box-shadow: 0 0 0 3px #ff1744, 0 0 14px 5px rgba(255, 23, 68, 0.85); }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span>Find in Images — PDF Viewer</span>
    <span id="status">Loading...</span>
    <span id="lang-label">OCR language:</span>
    <select id="lang-select" title="OCR language — changing this reprocesses the document">
      <option value="eng">English</option>
      <option value="dan">Danish</option>
      <option value="eng+dan">English + Danish</option>
    </select>
    <button id="reprocess" title="Clear cached OCR for all documents and reload">Clear cache</button>
  </div>

  <div id="find-bar" hidden>
    <input id="find-input" type="text" placeholder="Find in document" autocomplete="off" />
    <span id="find-count">0/0</span>
    <button type="button" id="find-prev" title="Previous match (Shift+Enter / ↑)">&#9650;</button>
    <button type="button" id="find-next" title="Next match (Enter / ↓)">&#9660;</button>
    <button type="button" id="find-close" title="Close (Esc)">&#10005;</button>
  </div>

  <div id="viewer-container"></div>

  <!-- Load Tesseract as a regular script so it creates a reliable window.Tesseract global.
       Dynamic ESM imports of bundled files can be blocked by MV3 CSP. -->
  <script src="../lib/tesseract/tesseract.min.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
