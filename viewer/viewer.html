<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Viewer</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #404040;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ── Toolbar ───────────────────────────────────────────────────────────── */
    #toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      height: 40px;
      background: #3c4043;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 0 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    .tb-sep {
      width: 1px;
      height: 22px;
      background: #5f6368;
      margin: 0 6px;
      flex-shrink: 0;
    }

    #toolbar button {
      background: transparent;
      border: none;
      color: #e8eaed;
      cursor: pointer;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #toolbar button:hover { background: rgba(255,255,255,0.1); }
    #toolbar button:disabled { opacity: 0.35; cursor: default; }
    #toolbar button:disabled:hover { background: transparent; }

    #page-input {
      width: 36px;
      text-align: center;
      background: #202124;
      color: #e8eaed;
      border: 1px solid #5f6368;
      border-radius: 3px;
      font-size: 13px;
      padding: 2px 4px;
    }
    #page-input:focus { outline: 2px solid #8ab4f8; border-color: transparent; }

    #page-total {
      color: #9aa0a6;
      font-size: 13px;
      white-space: nowrap;
    }

    #zoom-level {
      width: 44px;
      text-align: center;
      color: #e8eaed;
      font-size: 13px;
    }

    #toolbar a.tb-btn {
      background: transparent;
      border: none;
      color: #e8eaed;
      cursor: pointer;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #toolbar a.tb-btn:hover { background: rgba(255,255,255,0.1); }

    /* ── Viewer container ──────────────────────────────────────────────────── */
    #viewer-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-bottom: 40px;
      width: 100%;
      max-width: 1200px;
      padding-left: 20px;
      padding-right: 20px;
    }

    #error-message {
      color: #f88;
      font-size: 14px;
      text-align: center;
      padding: 40px 20px;
      line-height: 1.6;
      white-space: pre-line;
      max-width: 640px;
      display: none;
    }

    .page-wrapper {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .page-wrapper canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .text-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: visible;
    }

    .text-layer span {
      position: absolute;
      color: transparent;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      user-select: text;
      -webkit-user-select: text;
    }

    .text-layer span.variant {
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }

    .text-layer span::selection { background: rgba(0, 120, 255, 0.35); }

    /* ── Custom find bar ───────────────────────────────────────────────────── */
    #find-bar {
      position: fixed;
      top: 52px;
      right: 24px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 6px 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    #find-bar[hidden] { display: none; }

    #find-input {
      background: #1e1e1e;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
      width: 200px;
      outline: none;
    }

    #find-count {
      color: #aaa;
      font-size: 12px;
      min-width: 46px;
      text-align: center;
    }

    #find-bar button {
      background: #3a3a3a;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 9px;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }
    #find-bar button:hover { background: #4a4a4a; }
    #find-bar button:disabled { opacity: 0.4; cursor: default; }

    #lang-select {
      background: #3a3a3a;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .find-sep {
      width: 1px;
      height: 18px;
      background: #555;
      flex-shrink: 0;
    }

    /* ── Highlights ────────────────────────────────────────────────────────── */
    .find-highlight {
      position: absolute;
      background: rgba(255, 235, 59, 0.45);
      outline: 1.5px solid rgba(30, 30, 30, 0.85);
      border-radius: 2px;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 5;
    }
    .find-highlight.active {
      background: rgba(255, 90, 0, 0.55);
      outline: 2px solid #ffffff;
      box-shadow: 0 0 0 3px #ff1744, 0 0 10px 2px rgba(255, 23, 68, 0.7);
      z-index: 6;
      animation: fii-pulse 0.9s ease-out 2;
    }
    @keyframes fii-pulse {
      0%, 100% { box-shadow: 0 0 0 3px #ff1744, 0 0 0 0 rgba(255, 23, 68, 0.0); }
      50%       { box-shadow: 0 0 0 3px #ff1744, 0 0 14px 5px rgba(255, 23, 68, 0.85); }
    }

    /* ── Custom right-click context menu ───────────────────────────────────── */
    #ctx-menu {
      position: fixed;
      z-index: 1000;
      background: #2d2d2d;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 4px 0;
      min-width: 180px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      font-size: 13px;
    }
    #ctx-menu[hidden] { display: none; }

    #ctx-menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: transparent;
      border: none;
      color: #e8eaed;
      padding: 8px 16px;
      cursor: pointer;
      text-align: left;
    }
    #ctx-menu button:hover { background: rgba(255,255,255,0.08); }

    #ctx-menu .ctx-icon {
      font-size: 14px;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }

    #ctx-menu hr {
      border: none;
      border-top: 1px solid #444;
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <!-- ── Toolbar ─────────────────────────────────────────────────────────── -->
  <div id="toolbar">
    <!-- Page navigation -->
    <button id="page-prev" title="Previous page" disabled>&#8249;</button>
    <input  id="page-input" type="number" min="1" value="1" title="Current page" />
    <span   id="page-total">/ —</span>
    <button id="page-next" title="Next page" disabled>&#8250;</button>

    <div class="tb-sep"></div>

    <!-- Zoom -->
    <button id="zoom-out" title="Zoom out">&#8722;</button>
    <span   id="zoom-level">100%</span>
    <button id="zoom-in"  title="Zoom in">&#43;</button>

    <div class="tb-sep"></div>

    <!-- Download & Print -->
    <a id="download-btn" class="tb-btn" href="" download title="Download PDF">
      &#8595; Download
    </a>
    <button id="print-btn" title="Print (opens in native viewer)">&#128424; Print</button>
  </div>

  <!-- ── Find bar ────────────────────────────────────────────────────────── -->
  <div id="find-bar" hidden>
    <input id="find-input" type="text" placeholder="Find in document" autocomplete="off" />
    <span  id="find-count">0/0</span>
    <button type="button" id="find-prev" title="Previous match (Shift+Enter / ↑)">&#9650;</button>
    <button type="button" id="find-next" title="Next match (Enter / ↓)">&#9660;</button>
    <div class="find-sep"></div>
    <select id="lang-select" title="OCR language — changing this re-indexes the document">
      <option value="eng">EN</option>
      <option value="dan">DA</option>
      <option value="eng+dan">EN+DA</option>
    </select>
    <button type="button" id="find-close" title="Close (Esc)">&#10005;</button>
  </div>

  <!-- ── Viewer ──────────────────────────────────────────────────────────── -->
  <div id="viewer-container">
    <div id="error-message"></div>
  </div>

  <!-- ── Custom context menu ─────────────────────────────────────────────── -->
  <div id="ctx-menu" hidden>
    <button id="ctx-download"><span class="ctx-icon">&#8595;</span> Download PDF</button>
    <button id="ctx-print">   <span class="ctx-icon">&#128424;</span> Print</button>
    <hr />
    <button id="ctx-open">    <span class="ctx-icon">&#8599;</span> Open original in new tab</button>
  </div>

  <script src="../lib/tesseract/tesseract.min.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
