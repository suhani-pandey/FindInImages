<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="11.5">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <g fill="#0f172a" font-weight="600" text-anchor="middle">
    <text x="60" y="20">User</text>
    <text x="195" y="20">Chrome + DNR</text>
    <text x="350" y="20">viewer.js</text>
    <text x="480" y="20">PDF.js</text>
    <text x="595" y="20">Tesseract</text>
    <text x="685" y="20">IndexedDB</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="60" y1="28" x2="60" y2="392"/>
    <line x1="195" y1="28" x2="195" y2="392"/>
    <line x1="350" y1="28" x2="350" y2="392"/>
    <line x1="480" y1="28" x2="480" y2="392"/>
    <line x1="595" y1="28" x2="595" y2="392"/>
    <line x1="685" y1="28" x2="685" y2="392"/>
  </g>
  <g font-size="10.5" fill="#334155">
    <line x1="60" y1="52" x2="193" y2="52" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="126" y="47" text-anchor="middle">open report.pdf</text>
    <path d="M195 70 h40 v16 h-40" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="240" y="82" text-anchor="start">match *.pdf &#8594; redirect</text>
    <line x1="195" y1="104" x2="348" y2="104" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="272" y="99" text-anchor="middle">load viewer.html?url=…</text>
    <line x1="350" y1="128" x2="478" y2="128" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="414" y="123" text-anchor="middle">getDocument / render</text>
    <line x1="480" y1="148" x2="352" y2="148" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowg)"/>
    <text x="416" y="143" text-anchor="middle" fill="#64748b">canvas + native text</text>
    <line x1="350" y1="174" x2="683" y2="174" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="516" y="169" text-anchor="middle">getCachedPage(doc,page,lang)?</text>
    <line x1="685" y1="194" x2="352" y2="194" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowg)"/>
    <text x="516" y="189" text-anchor="middle" fill="#64748b">miss</text>
    <line x1="350" y1="220" x2="593" y2="220" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="470" y="215" text-anchor="middle">recognize(hi-res, preprocessed)</text>
    <line x1="595" y1="240" x2="352" y2="240" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowg)"/>
    <text x="473" y="235" text-anchor="middle" fill="#64748b">words + bounding boxes</text>
    <line x1="350" y1="266" x2="683" y2="266" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="516" y="261" text-anchor="middle">setCachedPage(normalized words)</text>
    <path d="M350 286 h44 v16 h-44" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="399" y="298" text-anchor="start" fill="#166534">map coords &#8594; inject invisible text layer</text>
    <line x1="60" y1="332" x2="348" y2="332" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="200" y="327" text-anchor="middle" fill="#3730a3" font-weight="600">Ctrl+F “invoice”</text>
    <line x1="350" y1="356" x2="62" y2="356" stroke="#4338ca" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <text x="206" y="351" text-anchor="middle" fill="#3730a3">highlight match on the image</text>
  </g>
  <text x="60" y="384" fill="#64748b" font-size="10">On a re-open, the cache hits at the lookup step and the OCR round-trip is skipped.</text>
</svg>
