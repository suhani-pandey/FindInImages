<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="11.5">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrowi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/></marker>
  </defs>
  <g fill="#0f172a" font-weight="600" text-anchor="middle">
    <text x="45" y="20">User</text>
    <text x="160" y="20">Chrome tab</text>
    <text x="290" y="20">Service worker</text>
    <text x="430" y="20">Offscreen doc</text>
    <text x="560" y="20">Tesseract</text>
    <text x="670" y="14">IndexedDB /</text>
    <text x="670" y="27">Cache Storage</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="45" y1="34" x2="45" y2="500"/>
    <line x1="160" y1="34" x2="160" y2="500"/>
    <line x1="290" y1="34" x2="290" y2="500"/>
    <line x1="430" y1="34" x2="430" y2="500"/>
    <line x1="560" y1="34" x2="560" y2="500"/>
    <line x1="670" y1="34" x2="670" y2="500"/>
  </g>
  <g font-size="10.5" fill="#334155">
    <line x1="45" y1="56" x2="288" y2="56" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="166" y="51" text-anchor="middle">Ctrl+Shift+F on scan.pdf</text>
    <line x1="290" y1="80" x2="428" y2="80" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="360" y="75" text-anchor="middle">job: URL, language, copy key</text>
    <path d="M430 98 h40 v16 h-38" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="476" y="110" text-anchor="start">download (cookies) · %PDF- · SHA-256</text>
    <line x1="430" y1="140" x2="668" y2="140" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="550" y="135" text-anchor="middle">words cached for (hash, lang, page)?</text>
    <line x1="670" y1="160" x2="432" y2="160" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowg)"/>
    <text x="550" y="155" text-anchor="middle" fill="#64748b">miss</text>
    <line x1="430" y1="186" x2="558" y2="186" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="494" y="181" text-anchor="middle">recognize(≈3000 px)</text>
    <line x1="560" y1="206" x2="432" y2="206" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowg)"/>
    <text x="496" y="201" text-anchor="middle" fill="#64748b">words + boxes</text>
    <line x1="430" y1="226" x2="292" y2="226" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowg)"/>
    <text x="360" y="221" text-anchor="middle" fill="#64748b">progress → badge %</text>
    <line x1="430" y1="250" x2="668" y2="250" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="550" y="245" text-anchor="middle">save words (IndexedDB)</text>
    <path d="M430 266 h40 v16 h-38" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="476" y="278" text-anchor="start" fill="#166534">map to PDF space · pdf-lib writes 3 Tr text</text>
    <line x1="430" y1="304" x2="668" y2="304" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="550" y="299" text-anchor="middle">put copy (Cache Storage)</text>
    <line x1="430" y1="326" x2="292" y2="326" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="360" y="321" text-anchor="middle">done (copy URL)</text>
    <line x1="290" y1="350" x2="162" y2="350" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="226" y="345" text-anchor="middle">navigate to copy URL</text>
    <line x1="160" y1="372" x2="288" y2="372" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="224" y="367" text-anchor="middle">fetch event</text>
    <line x1="290" y1="384" x2="668" y2="384" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrowg)"/>
    <text x="480" y="380" text-anchor="middle" fill="#64748b">match(copy key)</text>
    <line x1="290" y1="400" x2="162" y2="400" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowg)"/>
    <text x="226" y="395" text-anchor="middle" fill="#64748b">application/pdf</text>
    <path d="M160 412 h-40 v14 h38" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="114" y="424" text-anchor="end">native viewer</text>
    <line x1="45" y1="452" x2="158" y2="452" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrowi)"/>
    <text x="100" y="447" text-anchor="middle" fill="#3730a3" font-weight="600">Ctrl+F “invoice”</text>
    <line x1="160" y1="476" x2="47" y2="476" stroke="#4338ca" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrowi)"/>
    <text x="104" y="471" text-anchor="middle" fill="#3730a3">native highlight</text>
  </g>
  <text x="200" y="514" fill="#64748b" font-size="10">On a second visit the cache hits at the lookup step and the OCR round-trip is skipped.</text>
</svg>
