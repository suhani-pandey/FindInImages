<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="11.5">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="190" y="8" width="340" height="38" rx="8" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="360" y="32" text-anchor="middle">page.getTextContent() → existing text boxes</text>
  <line x1="360" y1="46" x2="360" y2="64" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="360,66 520,104 360,142 200,104" fill="#f8fafc" stroke="#475569"/>
  <text x="360" y="100" text-anchor="middle">paints images OR</text>
  <text x="360" y="115" text-anchor="middle">has no text?</text>
  <line x1="520" y1="104" x2="598" y2="104" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="559" y="96" text-anchor="middle" fill="#166534">no</text>
  <rect x="600" y="84" width="112" height="40" rx="8" fill="#eef2ff" stroke="#4338ca"/><text x="656" y="102" text-anchor="middle" font-size="10.5">nothing to add</text><text x="656" y="116" text-anchor="middle" font-size="9.5" fill="#64748b">already searchable</text>
  <line x1="360" y1="142" x2="360" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="156" fill="#b91c1c">yes</text>
  <polygon points="360,164 520,202 360,240 200,202" fill="#fffbeb" stroke="#d97706"/>
  <text x="360" y="198" text-anchor="middle">words cached for</text>
  <text x="360" y="213" text-anchor="middle">(SHA-256, lang, page)?</text>
  <line x1="520" y1="202" x2="598" y2="202" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="559" y="194" text-anchor="middle" fill="#92400e">hit</text>
  <rect x="600" y="180" width="112" height="44" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="656" y="198" text-anchor="middle" font-size="10.5">load words</text><text x="656" y="212" text-anchor="middle" font-size="9.5" fill="#64748b">from IndexedDB</text>
  <line x1="360" y1="240" x2="360" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="254" fill="#92400e">miss</text>
  <rect x="130" y="262" width="460" height="104" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="360" y="284" text-anchor="middle" font-weight="600" fill="#115e59">OCR pipeline (ocr.js)</text>
  <text x="360" y="303" text-anchor="middle" font-size="10.5">renderOCRCanvas — ≈3000 px wide, “print” intent (works while hidden)</text>
  <text x="360" y="320" text-anchor="middle" font-size="10.5">preprocessForOCR — gain-capped contrast stretch + unsharp mask</text>
  <text x="360" y="337" text-anchor="middle" font-size="10.5">recognize — Tesseract worker pool, sparse-text segmentation</text>
  <text x="360" y="354" text-anchor="middle" font-size="10.5">postProcessWords → normalize to 0–1 → setCachedPage</text>
  <line x1="656" y1="224" x2="656" y2="392" stroke="#64748b" stroke-width="1.5"/>
  <path d="M656 392 H 532" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="366" x2="360" y2="390" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="190" y="392" width="340" height="40" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="360" y="410" text-anchor="middle" font-size="11">preferCorrected — one form per word</text>
  <text x="360" y="424" text-anchor="middle" font-size="9.5" fill="#64748b">“he11o” is embedded as “hello”</text>
  <line x1="360" y1="432" x2="360" y2="452" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="190" y="454" width="340" height="40" rx="8" fill="#eef2ff" stroke="#4338ca"/>
  <text x="360" y="472" text-anchor="middle" font-size="11">toPdfWord — map into PDF user space</text>
  <text x="360" y="486" text-anchor="middle" font-size="9.5" fill="#64748b">baseline, width, font size, angle (Section 7.5)</text>
  <line x1="360" y1="494" x2="360" y2="514" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="190" y="516" width="340" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="360" y="534" text-anchor="middle" font-size="11">isNativeDuplicate — drop words the page already has</text>
  <text x="360" y="548" text-anchor="middle" font-size="9.5" fill="#64748b">same spot AND same text; different text is kept</text>
  <line x1="360" y1="556" x2="360" y2="576" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="190" y="578" width="340" height="44" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
  <text x="360" y="597" text-anchor="middle" font-weight="600" fill="#3730a3">embedWords — invisible text into the copy</text>
  <text x="360" y="612" text-anchor="middle" font-size="9.5" fill="#64748b">pdf-lib · 3 Tr · Tz squeeze · wrapped in q … Q</text>
  <text x="360" y="648" text-anchor="middle" font-size="10" fill="#64748b">Up to min(4, cores − 1) pages run this flow at the same time.</text>
</svg>
