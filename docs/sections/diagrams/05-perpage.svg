<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="11.5">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="200" y="8" width="320" height="38" rx="8" fill="#faf5ff" stroke="#7c3aed"/><text x="360" y="32" text-anchor="middle">page.getTextContent()</text>
  <line x1="360" y1="46" x2="360" y2="64" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="66" width="320" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="360" y="90" text-anchor="middle">injectPDFTextLayer() &#8594; pdfBoxes</text>
  <line x1="360" y1="104" x2="360" y2="122" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="360,124 520,162 360,200 200,162" fill="#f8fafc" stroke="#475569"/>
  <text x="360" y="158" text-anchor="middle">hasImages OR</text>
  <text x="360" y="173" text-anchor="middle">no native text?</text>
  <line x1="520" y1="162" x2="610" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="565" y="153" text-anchor="middle" fill="#166534">no</text>
  <rect x="612" y="142" width="100" height="40" rx="8" fill="#eef2ff" stroke="#4338ca"/><text x="662" y="160" text-anchor="middle" font-size="10.5">Done</text><text x="662" y="174" text-anchor="middle" font-size="9.5" fill="#64748b">text-only</text>
  <line x1="360" y1="200" x2="360" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="214" fill="#b91c1c">yes</text>
  <polygon points="360,222 520,260 360,298 200,260" fill="#fffbeb" stroke="#d97706"/>
  <text x="360" y="256" text-anchor="middle">OCR cached for</text>
  <text x="360" y="271" text-anchor="middle">(doc, page, lang)?</text>
  <line x1="520" y1="260" x2="600" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="251" text-anchor="middle" fill="#92400e">hit</text>
  <rect x="602" y="238" width="110" height="44" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="657" y="256" text-anchor="middle" font-size="10.5">load words</text><text x="657" y="270" text-anchor="middle" font-size="9.5" fill="#64748b">from IndexedDB</text>
  <line x1="360" y1="298" x2="360" y2="318" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="312" fill="#92400e">miss</text>
  <rect x="150" y="320" width="420" height="84" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="360" y="342" text-anchor="middle" font-weight="600" fill="#115e59">OCR pipeline</text>
  <text x="360" y="360" text-anchor="middle" font-size="10.5">renderOCRCanvas (≈3000px) &#8594; preprocessForOCR</text>
  <text x="360" y="376" text-anchor="middle" font-size="10.5">&#8594; runOCR (Tesseract, workers) &#8594; postProcessWords</text>
  <text x="360" y="392" text-anchor="middle" font-size="10.5">&#8594; normalize &#8594; setCachedPage</text>
  <line x1="657" y1="282" x2="657" y2="430" stroke="#64748b" stroke-width="1.5"/>
  <path d="M657 430 H 520" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="404" x2="360" y2="430" stroke="#64748b" stroke-width="1.5"/>
  <rect x="200" y="432" width="320" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="360" y="450" text-anchor="middle" font-size="11">denormalize &#8594; filterOverlappingWords(pdfBoxes)</text>
  <text x="360" y="465" text-anchor="middle" font-size="9.5" fill="#64748b">text-aware de-duplication</text>
  <line x1="360" y1="472" x2="360" y2="490" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="492" width="320" height="40" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
  <text x="360" y="510" text-anchor="middle" font-weight="600" fill="#3730a3">appendOCRTextLayer()</text>
  <text x="360" y="524" text-anchor="middle" font-size="9.5" fill="#64748b">invisible spans &#8594; searchable by Ctrl+F</text>
</svg>
