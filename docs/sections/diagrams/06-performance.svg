<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="11.5">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="10" y="14" width="700" height="96" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="22" y="33" fill="#1e3a8a" font-weight="700" font-size="11">ON-DEMAND TRACK — keeps interaction instant</text>
  <rect x="24" y="44" width="150" height="50" rx="7" fill="#fff" stroke="#2563eb"/><text x="99" y="65" text-anchor="middle" font-size="11">IntersectionObserver</text><text x="99" y="80" text-anchor="middle" font-size="10" fill="#64748b">render page near view</text>
  <line x1="174" y1="69" x2="214" y2="69" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="216" y="44" width="150" height="50" rx="7" fill="#fff" stroke="#7c3aed"/><text x="291" y="65" text-anchor="middle" font-size="11">DPR-scaled canvas</text><text x="291" y="80" text-anchor="middle" font-size="10" fill="#64748b">crisp, fit-to-width</text>
  <line x1="366" y1="69" x2="406" y2="69" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="408" y="44" width="150" height="50" rx="7" fill="#fff" stroke="#16a34a"/><text x="483" y="65" text-anchor="middle" font-size="11">inject text layer</text><text x="483" y="80" text-anchor="middle" font-size="10" fill="#64748b">searchable immediately</text>
  <rect x="582" y="44" width="116" height="50" rx="7" fill="#fff" stroke="#d97706"/><text x="640" y="65" text-anchor="middle" font-size="11">cache hit?</text><text x="640" y="80" text-anchor="middle" font-size="10" fill="#64748b">skip OCR</text>
  <rect x="10" y="122" width="700" height="110" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="22" y="141" fill="#115e59" font-weight="700" font-size="11">BACKGROUND TRACK — full-document searchability without blocking</text>
  <rect x="24" y="152" width="180" height="64" rx="7" fill="#fff" stroke="#0d9488"/><text x="114" y="178" text-anchor="middle" font-size="11">requestIdleCallback</text><text x="114" y="194" text-anchor="middle" font-size="10" fill="#64748b">pump remaining pages</text><text x="114" y="208" text-anchor="middle" font-size="10" fill="#64748b">during idle time</text>
  <line x1="204" y1="184" x2="244" y2="184" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="246" y="152" width="300" height="20" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="396" y="166" text-anchor="middle" font-size="10">OCR worker 1</text>
  <rect x="246" y="174" width="300" height="20" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="396" y="188" text-anchor="middle" font-size="10">OCR worker 2 … (up to cores &#8722; 1, capped at 4)</text>
  <rect x="246" y="196" width="300" height="20" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="396" y="210" text-anchor="middle" font-size="10">OCR worker N — Tesseract scheduler</text>
  <line x1="546" y1="184" x2="582" y2="184" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="584" y="160" width="114" height="48" rx="7" fill="#eef2ff" stroke="#4338ca"/><text x="641" y="180" text-anchor="middle" font-size="10.5">all pages</text><text x="641" y="194" text-anchor="middle" font-size="10.5">searchable</text>
</svg>
